<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Escala, equipes e instruções do ministério de transmissão.">
<meta property="og:title" content="Escala da Transmissão">
<meta property="og:description" content="Quem está escalado em cada função, por data.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%23111827%27/%3E%3Crect x=%275%27 y=%2710%27 width=%2714%27 height=%2712%27 rx=%272.6%27 fill=%27%236E9BFF%27/%3E%3Cpath d=%27M21 13.4 26.5 10v12L21 18.6Z%27 fill=%27%236E9BFF%27/%3E%3Ccircle cx=%2712%27 cy=%2716%27 r=%272.6%27 fill=%27%23111827%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Public+Sans:wght@400;500;600&display=swap">
<title>Escala da Transmissão</title>
<style>
:root{
  --ground:#f7f8fa; --surface:#ffffff; --surface-2:#eef1f5; --surface-3:#e4e8ef;
  --border:#e0e5ed; --border-2:#c9d2df;
  --ink:#12161d; --muted:#5b6675; --faint:#8a94a3;
  --accent:#2563eb; --accent-ink:#ffffff; --accent-soft:#e8effe; --accent-line:#c2d5fd;
  --onair:#e0483d;
  --shadow:0 1px 2px rgba(17,24,39,.05), 0 10px 26px -14px rgba(17,24,39,.22);
  --shadow-lg:0 28px 66px -22px rgba(17,24,39,.40);
  --r:14px; --r-sm:9px; --pill:999px;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --body:"Public Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0b0d11; --surface:#14181e; --surface-2:#1b202a; --surface-3:#242b36;
  --border:#262d38; --border-2:#38424f;
  --ink:#e9edf3; --muted:#98a2b3; --faint:#6d7787;
  --accent:#6e9bff; --accent-ink:#0b0d11; --accent-soft:#16233c; --accent-line:#2c406a;
  --onair:#f2695c;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 30px -16px rgba(0,0,0,.75);
  --shadow-lg:0 30px 70px -24px rgba(0,0,0,.85);
}}
:root[data-theme="dark"]{
  --ground:#0b0d11; --surface:#14181e; --surface-2:#1b202a; --surface-3:#242b36;
  --border:#262d38; --border-2:#38424f;
  --ink:#e9edf3; --muted:#98a2b3; --faint:#6d7787;
  --accent:#6e9bff; --accent-ink:#0b0d11; --accent-soft:#16233c; --accent-line:#2c406a;
  --onair:#f2695c;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 30px -16px rgba(0,0,0,.75);
  --shadow-lg:0 30px 70px -24px rgba(0,0,0,.85);
}

*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.62;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-family:var(--display);font-weight:600;line-height:1.2;letter-spacing:-.02em;text-wrap:balance}
p{margin:0 0 .8em}
p:last-child{margin-bottom:0}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
[hidden]{display:none !important}

/* ---- cabecalho ---- */
.topo{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--ground) 86%,transparent);backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);border-bottom:1px solid var(--border)}
.topo-in{max-width:1080px;margin:0 auto;padding:0 20px;height:60px;display:flex;align-items:center;gap:14px}
.marca{display:flex;align-items:center;gap:10px;min-width:0}
.luz{width:9px;height:9px;border-radius:50%;background:var(--onair);flex:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--onair) 20%,transparent);animation:pulsa 2.6s ease-in-out infinite}
@keyframes pulsa{0%,100%{opacity:1}50%{opacity:.42}}
.marca b{font-family:var(--display);font-size:14.5px;font-weight:600;letter-spacing:-.015em;white-space:nowrap}
.marca small{display:block;font-size:11px;color:var(--faint);white-space:nowrap}
.abas{display:flex;gap:2px;margin-left:auto}
.abas button{background:none;border:0;color:var(--muted);padding:7px 13px;border-radius:var(--pill);font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;font-family:var(--body)}
.abas button:hover{background:var(--surface-2);color:var(--ink)}
.abas button[aria-current="page"]{background:var(--surface-3);color:var(--ink);font-weight:600}
.acoes-topo{display:flex;align-items:center;gap:8px}

.faixa-edicao{background:var(--accent-soft);border-top:1px solid var(--accent-line);font-size:13px;padding:8px 20px;display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap}
.faixa-edicao .pt{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.link-txt{background:none;border:0;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:2px;padding:0;font-family:var(--body)}

/* ---- botoes ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 15px;border-radius:var(--r-sm);border:1px solid transparent;background:var(--accent);color:var(--accent-ink);font-family:var(--body);font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap;transition:filter .14s,background .14s}
.btn:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-2{background:var(--surface);color:var(--ink);border-color:var(--border-2)}
.btn-2:hover{background:var(--surface-2);filter:none}
.btn-g{background:transparent;color:var(--muted);padding:6px 9px}
.btn-g:hover{background:var(--surface-2);color:var(--ink);filter:none}
.btn-x{background:transparent;color:var(--onair);padding:6px 9px}
.btn-x:hover{background:color-mix(in srgb,var(--onair) 12%,transparent);filter:none}
.btn-p{padding:5px 10px;font-size:12.5px}
.btn svg,.ico svg{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.ico{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--surface);cursor:pointer;color:var(--muted)}
.ico:hover{background:var(--surface-2);color:var(--ink)}
.lua{display:none}
:root[data-theme="dark"] .sol{display:none}
:root[data-theme="dark"] .lua{display:block}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sol{display:none}:root:not([data-theme="light"]) .lua{display:block}}

/* ---- estrutura ---- */
.pagina{max-width:1080px;margin:0 auto;padding:32px 20px 72px}
.cab{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.cab h1{font-size:26px}
.sub{color:var(--muted);font-size:14px;margin-top:4px}
.secao{margin-top:38px}
.secao>h2{font-family:var(--display);font-size:11.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--faint);font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.secao>h2::after{content:"";flex:1;height:1px;background:var(--border)}
.col{display:grid;gap:12px}

/* ---- data / escala ---- */
.data-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 20px}
.data-card.proxima{border-color:var(--accent-line);background:linear-gradient(162deg,var(--accent-soft),var(--surface) 60%)}
.linha1{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}
.dia{display:flex;align-items:baseline;gap:8px;font-variant-numeric:tabular-nums;font-family:var(--display)}
.dia b{font-size:31px;font-weight:700;letter-spacing:-.04em;line-height:1}
.dia span{font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.info{flex:1;min-width:190px}
.info h3{font-size:16.5px}
.meta{display:flex;gap:5px 14px;flex-wrap:wrap;color:var(--muted);font-size:13.5px;margin-top:2px}
.meta span{display:inline-flex;align-items:center;gap:5px}
.meta svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tag{display:inline-flex;align-items:center;font-family:var(--display);font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;padding:4px 9px;border-radius:var(--pill);background:var(--surface-3);color:var(--muted)}
.tag-a{background:var(--accent);color:var(--accent-ink)}
.tag-h{background:var(--onair);color:#fff}
.acs{display:flex;gap:2px;margin-left:auto}

/* fileira de fontes do switcher */
.canais{display:grid;gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--r-sm);overflow:hidden;margin-top:16px;grid-template-columns:repeat(auto-fit,minmax(178px,1fr))}
.canal{background:var(--surface);padding:11px 13px;display:flex;flex-direction:column;gap:6px}
.canal-nome{font-family:var(--display);font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--faint);font-weight:600}
.op{display:flex;flex-wrap:wrap;gap:5px}
.op b{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--pill);padding:2px 10px;font-size:13px;font-weight:500}
.livre{color:var(--faint);font-size:13px;font-style:italic}
.obs{margin-top:14px;padding:10px 13px;background:var(--surface-2);border-radius:var(--r-sm);font-size:13.5px;color:var(--muted);border-left:3px solid var(--border-2)}

.linha{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--border)}
.linha:last-child{border-bottom:0}
.linha .d{font-variant-numeric:tabular-nums;font-weight:600;font-size:14px;min-width:92px;color:var(--muted)}
.linha .t{font-weight:500;flex:1;min-width:130px}
.caixa{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}

/* ---- equipes ---- */
.eq-layout{display:grid;grid-template-columns:222px minmax(0,1fr);gap:30px;align-items:start}
.lateral{position:sticky;top:78px;display:flex;flex-direction:column;gap:2px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:8px;box-shadow:var(--shadow)}
.lateral .tit{font-family:var(--display);font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--faint);font-weight:600;padding:7px 10px 5px}
.lateral button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:0;padding:9px 11px;border-radius:var(--r-sm);color:var(--muted);font-family:var(--body);font-size:14px;font-weight:500;cursor:pointer}
.lateral button:hover{background:var(--surface-2);color:var(--ink)}
.lateral button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600;box-shadow:inset 2px 0 0 var(--accent)}
.lateral .n{margin-left:auto;font-size:11.5px;color:var(--faint);background:var(--surface-2);border-radius:var(--pill);padding:1px 8px;font-variant-numeric:tabular-nums}
.eq-cab{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;padding-bottom:18px;border-bottom:1px solid var(--border)}
.eq-cab h1{font-size:24px}

/* ---- blocos ---- */
.blocos{display:grid;gap:14px}
.bloco{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:19px 22px;box-shadow:var(--shadow);position:relative}
.bloco h3{font-size:16px;margin-bottom:9px}
.bloco-acs{position:absolute;top:12px;right:12px;display:flex;gap:2px}
.prosa{font-size:14.5px;max-width:66ch}
.prosa ul,.prosa ol{margin:0 0 .8em;padding-left:21px}
.prosa li{margin-bottom:5px}
.prosa li::marker{color:var(--faint)}
.prosa code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.88em;background:var(--surface-2);border:1px solid var(--border);padding:1px 5px;border-radius:5px}
.prosa blockquote{margin:0 0 .8em;padding:2px 0 2px 15px;border-left:3px solid var(--accent);color:var(--muted)}
.prosa strong{font-weight:600}
.prosa h4{margin:16px 0 7px;font-size:15px}

.gente{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(212px,1fr))}
.pessoa{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);padding:12px 14px;display:flex;align-items:flex-start;gap:11px}
.ini{width:33px;height:33px;border-radius:50%;flex:none;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--display);font-weight:600;font-size:13px}
.pessoa .dd{min-width:0;flex:1}
.pessoa strong{font-size:14px;font-weight:600;display:block}
.pessoa small{color:var(--muted);font-size:12.5px;display:block}

.vazio{border:1px dashed var(--border-2);border-radius:var(--r);padding:30px 24px;text-align:center;color:var(--muted)}
.vazio strong{display:block;color:var(--ink);font-size:15px;margin-bottom:5px;font-family:var(--display);font-weight:600}
.vazio p{font-size:13.5px;max-width:380px;margin:0 auto}
.vazio .btn{margin-top:15px}

/* ---- formularios / modal ---- */
.campo{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.campo>label{font-size:12.5px;font-weight:600;color:var(--muted)}
.dica{font-size:12px;color:var(--faint);font-weight:400}
input[type=text],input[type=date],input[type=time],input[type=password],textarea{width:100%;padding:9px 12px;background:var(--ground);border:1px solid var(--border-2);border-radius:var(--r-sm);color:var(--ink);font-family:var(--body);font-size:14px}
textarea{resize:vertical;min-height:118px;line-height:1.6;font-size:13.5px}
input:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
input::placeholder,textarea::placeholder{color:var(--faint)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.esc-campo{display:grid;grid-template-columns:126px minmax(0,1fr);gap:12px;align-items:center;margin-bottom:9px}
.esc-campo>label{font-size:12.5px;font-weight:600;color:var(--muted)}
.sugs{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.sug{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--pill);padding:2px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;font-family:var(--body)}
.sug:hover{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}

.fundo{position:fixed;inset:0;z-index:60;background:rgba(9,12,17,.55);backdrop-filter:blur(3px);display:grid;place-items:center;padding:20px}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-lg);width:min(560px,100%);max-height:min(86vh,780px);display:flex;flex-direction:column;animation:sobe .18s cubic-bezier(.2,.8,.3,1)}
@keyframes sobe{from{transform:translateY(9px);opacity:0}to{transform:none;opacity:1}}
.modal-cab{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:17px 20px 13px;border-bottom:1px solid var(--border)}
.modal-cab h2{font-size:17px}
.modal-corpo{padding:18px 20px;overflow-y:auto}
.modal-pe{display:flex;justify-content:flex-end;gap:9px;padding:13px 20px;border-top:1px solid var(--border);background:var(--surface-2);border-radius:0 0 16px 16px}
.erro{background:color-mix(in srgb,var(--onair) 12%,transparent);color:var(--onair);border:1px solid color-mix(in srgb,var(--onair) 32%,transparent);border-radius:var(--r-sm);padding:9px 12px;font-size:13px;margin-bottom:13px}

.avisos{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:calc(100% - 32px);max-width:420px}
.aviso{background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:var(--pill);font-size:13.5px;font-weight:500;box-shadow:var(--shadow-lg);animation:sobe .2s ease-out}
.aviso.ruim{background:var(--onair);color:#fff}

.rodape{border-top:1px solid var(--border);padding:20px;text-align:center;color:var(--faint);font-size:12.5px}

@media (max-width:880px){
  .eq-layout{grid-template-columns:1fr;gap:16px}
  .lateral{position:sticky;top:60px;z-index:20;flex-direction:row;overflow-x:auto;scrollbar-width:none}
  .lateral::-webkit-scrollbar{display:none}
  .lateral .tit{display:none}
  .lateral button{white-space:nowrap;width:auto;box-shadow:none !important}
  .lateral button[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
  .lateral button[aria-current="page"] .n{background:rgba(0,0,0,.18);color:inherit}
}
@media (max-width:680px){
  .marca small{display:none}
  .topo-in{height:auto;flex-wrap:wrap;padding:10px 14px;gap:10px}
  .topo{position:static}
  .lateral{top:0}
  .abas{order:3;width:100%;margin:0;overflow-x:auto;scrollbar-width:none}
  .abas::-webkit-scrollbar{display:none}
  .pagina{padding:24px 14px 60px}
  .duo,.esc-campo{grid-template-columns:1fr}
  .esc-campo{gap:6px}
  .canais{grid-template-columns:1fr 1fr}
  .bloco{padding:16px 17px}
  .bloco-acs{position:static;margin-bottom:8px}
}
@media (max-width:400px){.canais{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}}
@media print{.topo,.rodape,.avisos,.acs,.bloco-acs,.faixa-edicao,.lateral{display:none !important}body{background:#fff;color:#000}.data-card,.bloco{box-shadow:none;break-inside:avoid}.proxima{background:#fff}}
</style>

</head>
<body>
<header class="topo">
  <div class="topo-in">
    <div class="marca">
      <span class="luz" aria-hidden="true"></span>
      <div><b>Ministério de Transmissão</b><small>Escala e organização da equipe</small></div>
    </div>
    <nav class="abas" aria-label="Seções">
      <button type="button" data-aba="geral">Geral</button>
      <button type="button" data-aba="equipes">Equipes</button>
      <button type="button" data-aba="instrucoes">Instruções</button>
    </nav>
    <div class="acoes-topo">
      <button type="button" class="ico" id="btn-tema" aria-label="Alternar tema claro e escuro">
        <svg class="sol" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.2 12H2M22 12h-2.2M5.6 5.6 4 4M20 20l-1.6-1.6M18.4 5.6 20 4M4 20l1.6-1.6"/></svg>
        <svg class="lua" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.2A8.2 8.2 0 0 1 9.8 4a8.4 8.4 0 1 0 10.2 10.2Z"/></svg>
      </button>
      <button type="button" class="btn btn-2" id="btn-editar" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 10V7.5a6 6 0 1 1 12 0V10"/><rect x="4" y="10" width="16" height="10.5" rx="2.2"/></svg>
        <span>Editar</span>
      </button>
    </div>
  </div>
  <div class="faixa-edicao" id="faixa" hidden>
    <span class="pt" aria-hidden="true"></span>
    Modo edição — o que você salvar fica visível para todo mundo que abrir o link.
    <button type="button" class="link-txt" id="btn-sair">Sair do modo edição</button>
  </div>
</header>

<main class="pagina" id="app"></main>

<footer class="rodape">Ministério de Transmissão · escala mantida manualmente pela liderança da equipe.</footer>

<div id="modais"></div>
<div class="avisos" id="avisos" aria-live="polite"></div>

<script id="estado" type="application/json">{"equipes": [{"id": "camera-central", "nome": "Câmera Central", "resumo": "Plano principal e fixo do palco."}, {"id": "camera-movel", "nome": "Câmera Móvel", "resumo": "Plano de apoio, ombro e movimentação pela nave."}, {"id": "grua", "nome": "Grua", "resumo": "Planos altos e movimentos de abertura."}, {"id": "corte", "nome": "Corte", "resumo": "Switcher: decide o que vai ao ar."}, {"id": "computador", "nome": "Computador", "resumo": "Slides, letras, vídeos e transmissão online."}], "transmissoes": [], "membros": {}, "blocos": {"equipe:camera-central": [{"id": 1, "titulo": "O que essa função faz", "corpo": "A **câmera central** entrega o plano principal da transmissão. É o enquadramento que fica no ar na maior parte do tempo, então estabilidade e consistência valem mais do que movimento.\n\n- Plano padrão: **meio-primeiro plano** do pregador, com um pouco de espaço acima da cabeça.\n- Sem zoom brusco. Se precisar corrigir enquadramento, faça devagar.\n- Acompanhe quem está falando, mas não persiga: deixe a pessoa se mover dentro do quadro.\n- Fique atento ao retorno do corte para saber quando você está no ar."}, {"id": 2, "titulo": "Checklist antes de começar", "corpo": "1. Câmera ligada, bateria carregada e cabo de energia conectado.\n2. Cartão de memória com espaço, se estiver gravando local.\n3. Cabo de vídeo conectado e imagem chegando no switcher.\n4. Balanço de branco batendo com as outras câmeras.\n5. Tripé travado e nivelado."}], "equipe:camera-movel": [{"id": 3, "titulo": "O que essa função faz", "corpo": "A **câmera móvel** é o respiro da transmissão: detalhes, reações da congregação, músicos, plano aberto lateral.\n\n- Busque planos que a central não consegue: mãos no instrumento, rosto de quem canta, plano geral do salão.\n- Antes de andar, verifique o cabo. Nunca cruze a frente da câmera central.\n- Segure cada enquadramento por pelo menos **5 segundos** parado antes de mudar.\n- Movimento só com propósito. Câmera tremendo cansa quem assiste."}, {"id": 4, "titulo": "Checklist antes de começar", "corpo": "1. Bateria cheia e bateria reserva no bolso.\n2. Cabo com folga suficiente para o trajeto que você vai fazer.\n3. Combinar com o corte os pontos onde você vai se posicionar.\n4. Monopé ou estabilizador ajustado na sua altura."}], "equipe:grua": [{"id": 5, "titulo": "O que essa função faz", "corpo": "A **grua** entrega os planos de abertura e os movimentos que dão escala ao ambiente.\n\n- Use com parcimônia: normalmente na abertura, no louvor e no encerramento.\n- Movimento lento e contínuo. Comece e termine com o plano parado.\n- Sempre avise o corte antes de iniciar um movimento.\n- Atenção à área de segurança: ninguém passa por baixo do braço em movimento."}, {"id": 6, "titulo": "Segurança", "corpo": "> A grua é o equipamento com maior risco físico da equipe. Nada aqui é opcional.\n\n- Confira o contrapeso antes de cada uso.\n- Trave o braço quando não estiver operando.\n- Não faça montagem nem desmontagem sozinho.\n- Se algo parecer folgado, pare e chame o responsável."}], "equipe:corte": [{"id": 7, "titulo": "O que essa função faz", "corpo": "O **corte** decide o que a igreja em casa está vendo. É a função que amarra todas as outras.\n\n- Corte no tempo da música e da fala, não no impulso.\n- Prepare a próxima câmera no preview antes de cortar.\n- Evite ficar mais de 15 a 20 segundos no mesmo plano em momentos dinâmicos.\n- Fale com as câmeras pelo intercom com antecedência: peça o plano antes de precisar dele."}, {"id": 8, "titulo": "Checklist antes de começar", "corpo": "1. Todas as fontes de vídeo chegando e identificadas no switcher.\n2. Intercom testado com cada câmera, uma por uma.\n3. Vinhetas e artes carregadas na ordem do culto.\n4. Gravação do programa iniciada."}], "equipe:computador": [{"id": 9, "titulo": "O que essa função faz", "corpo": "O **computador** cuida de tudo que é gráfico e do envio da transmissão: letras, slides, versículos, vídeos e o streaming.\n\n- Receba a lista de músicas e a referência da pregação antes do culto.\n- Confira a letra completa de cada música, incluindo repetições.\n- Suba a letra no tempo da banda, um pouco antes de a frase começar.\n- Fique de olho no indicador de streaming durante todo o culto."}, {"id": 10, "titulo": "Checklist antes de começar", "corpo": "1. Internet testada — cabo, não Wi-Fi, sempre que possível.\n2. Software de transmissão aberto e conectado com a plataforma.\n3. Bitrate e resolução conferidos.\n4. Slides e vídeos do dia carregados e testados com áudio.\n5. Transmissão agendada e link publicado nas redes."}], "instrucoes": [{"id": 11, "titulo": "Antes do culto", "corpo": "Chegue com **1 hora de antecedência**. O tempo antes do culto é o que evita problema durante.\n\n1. Ligue e teste todos os equipamentos da sua função.\n2. Confira o intercom com a mesa de corte.\n3. Alinhe cor e exposição entre as câmeras.\n4. Verifique o áudio que está entrando na transmissão.\n5. Confirme com o líder a ordem do culto e mudanças de última hora."}, {"id": 12, "titulo": "Durante o culto", "corpo": "- Silêncio no intercom, exceto para o que é da operação.\n- Celular no silencioso e longe do enquadramento.\n- Se algo der errado, **avise no intercom em vez de tentar resolver sozinho**.\n- Nunca desligue nada sem confirmar com o corte.\n- Roupa neutra e discreta, principalmente para quem circula pela nave."}, {"id": 13, "titulo": "Depois do culto", "corpo": "1. Encerre a transmissão e confirme que a gravação foi salva.\n2. Faça backup do material bruto no destino combinado.\n3. Desligue os equipamentos na ordem: câmeras, switcher, computador.\n4. Guarde os cabos enrolados corretamente e tudo no lugar de origem.\n5. Anote no grupo qualquer defeito ou item faltando."}, {"id": 14, "titulo": "Combinados da equipe", "corpo": "- Se não puder vir na data em que está escalado, **avise com pelo menos 48 horas** e ajude a encontrar substituto.\n- Quem está escalado confirma presença no grupo até a sexta-feira.\n- Dúvida sobre a função? Pergunte antes do culto, não durante.\n- Todo mundo ajuda na montagem e na desmontagem, independente da função."}]}}</script>
<script>

let aba = "geral", equipeAtual = (ESTADO.equipes[0] || {}).id || null, editando = false, artifact = null;

const PIN = "Nacoesadm@";
const app = document.getElementById("app");
const raizModais = document.getElementById("modais");

/* ---------------- utilidades ---------------- */
const E = {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"};
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => E[c]);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

const I = {
  lapis:'<path d="M4 20h4l10.5-10.5a2.6 2.6 0 0 0-3.7-3.7L4.3 16.3Z"/><path d="m13.8 7.3 2.9 2.9"/>',
  lixo:'<path d="M4.5 6.5h15M9.5 6.5V4.8A1.3 1.3 0 0 1 10.8 3.5h2.4a1.3 1.3 0 0 1 1.3 1.3v1.7M6.4 6.5l.8 12.2a1.6 1.6 0 0 0 1.6 1.5h6.4a1.6 1.6 0 0 0 1.6-1.5l.8-12.2"/>',
  mais:'<path d="M12 5.5v13M5.5 12h13"/>',
  relogio:'<circle cx="12" cy="12" r="8.4"/><path d="M12 7.4V12l3 1.8"/>',
  pino:'<path d="M12 21s6.5-5.8 6.5-10.3A6.5 6.5 0 0 0 5.5 10.7C5.5 15.2 12 21 12 21Z"/><circle cx="12" cy="10.5" r="2.3"/>',
  x:'<path d="m6 6 12 12M18 6 6 18"/>',
  cima:'<path d="M12 19V5M6 11l6-6 6 6"/>',
  baixo:'<path d="M12 5v14M18 13l-6 6-6-6"/>'
};
const ic = n => '<svg viewBox="0 0 24 24" aria-hidden="true">' + I[n] + "</svg>";

function aviso(txt, ruim) {
  const el = document.createElement("div");
  el.className = "aviso" + (ruim ? " ruim" : "");
  el.textContent = txt;
  document.getElementById("avisos").appendChild(el);
  setTimeout(() => el.remove(), ruim ? 5200 : 3200);
}

/* ---------------- markdown leve ---------------- */
function emLinha(t) {
  return t.replace(/`([^`]+)`/g, "<code>$1</code>")
          .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
          .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>")
          .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
}
function md(bruto) {
  const linhas = esc(bruto).split(/\r?\n/), out = [];
  let lista = null, par = [];
  const fp = () => { if (par.length) { out.push("<p>" + emLinha(par.join("<br>")) + "</p>"); par = []; } };
  const fl = () => { if (lista) { out.push("</" + lista + ">"); lista = null; } };
  for (const bruta of linhas) {
    const l = bruta.trim();
    if (!l) { fp(); fl(); continue; }
    const h = l.match(/^#{1,4}\s+(.*)$/);
    if (h) { fp(); fl(); out.push("<h4>" + emLinha(h[1]) + "</h4>"); continue; }
    const q = l.match(/^&gt;\s?(.*)$/);
    if (q) { fp(); fl(); out.push("<blockquote>" + emLinha(q[1]) + "</blockquote>"); continue; }
    const li = l.match(/^[-*]\s+(.*)$/);
    if (li) { fp(); if (lista !== "ul") { fl(); out.push("<ul>"); lista = "ul"; } out.push("<li>" + emLinha(li[1]) + "</li>"); continue; }
    const nu = l.match(/^\d+[.)]\s+(.*)$/);
    if (nu) { fp(); if (lista !== "ol") { fl(); out.push("<ol>"); lista = "ol"; } out.push("<li>" + emLinha(nu[1]) + "</li>"); continue; }
    fl(); par.push(l);
  }
  fp(); fl();
  return out.join("\n");
}

/* ---------------- datas ---------------- */
const fSemana = new Intl.DateTimeFormat("pt-BR", { weekday: "long" });
const fMes = new Intl.DateTimeFormat("pt-BR", { month: "short" });
const fCurta = new Intl.DateTimeFormat("pt-BR", { day: "2-digit", month: "2-digit", year: "numeric" });
const dt = iso => { const [a, m, d] = String(iso).split("-").map(Number); return new Date(a, m - 1, d); };
const maiusc = s => s.charAt(0).toUpperCase() + s.slice(1);
const mesCurto = d => fMes.format(d).replace(/\./g, "").toUpperCase();
const hojeISO = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const dias = (a, b) => Math.round((dt(b) - dt(a)) / 86400000);
function relativo(n) {
  if (n === 0) return "hoje";
  if (n === 1) return "amanhã";
  if (n < 0) return null;
  if (n < 7) return "em " + n + " dias";
  if (n < 14) return "na próxima semana";
  if (n < 31) return "em " + Math.round(n / 7) + " semanas";
  return null;
}

/* ---------------- blocos ---------------- */
function htmlBlocos(pag, vazio) {
  const lista = ESTADO.blocos[pag] || [];
  const add = editando ? '<button type="button" class="btn btn-2" data-a="novo-bloco" data-p="' + esc(pag) + '">' + ic("mais") + " Adicionar bloco</button>" : "";
  if (!lista.length) {
    return '<div class="vazio"><strong>' + esc(vazio) + "</strong><p>" +
      (editando ? "Escreva orientações, avisos ou um checklist para esta página." : "A liderança ainda vai publicar as informações desta página.") +
      "</p>" + add + "</div>";
  }
  const itens = lista.map((b, i) => {
    const acs = editando ? '<div class="bloco-acs">' +
      (i > 0 ? '<button type="button" class="btn btn-g btn-p" data-a="mover" data-p="' + esc(pag) + '" data-id="' + b.id + '" data-dir="-1" aria-label="Mover para cima">' + ic("cima") + "</button>" : "") +
      (i < lista.length - 1 ? '<button type="button" class="btn btn-g btn-p" data-a="mover" data-p="' + esc(pag) + '" data-id="' + b.id + '" data-dir="1" aria-label="Mover para baixo">' + ic("baixo") + "</button>" : "") +
      '<button type="button" class="btn btn-g btn-p" data-a="editar-bloco" data-p="' + esc(pag) + '" data-id="' + b.id + '" aria-label="Editar">' + ic("lapis") + "</button>" +
      '<button type="button" class="btn btn-x btn-p" data-a="apagar-bloco" data-p="' + esc(pag) + '" data-id="' + b.id + '" aria-label="Apagar">' + ic("lixo") + "</button></div>" : "";
    return '<article class="bloco">' + acs + (b.titulo ? "<h3>" + esc(b.titulo) + "</h3>" : "") + '<div class="prosa">' + md(b.corpo) + "</div></article>";
  }).join("");
  return '<div class="blocos">' + itens + "</div>" + (add ? '<div style="margin-top:14px">' + add + "</div>" : "");
}

/* ---------------- geral ---------------- */
function htmlCanais(t) {
  return '<div class="canais">' + ESTADO.equipes.map(eq => {
    const nomes = (t.escala || {})[eq.id] || [];
    return '<div class="canal"><span class="canal-nome">' + esc(eq.nome) + '</span><span class="op">' +
      (nomes.length ? nomes.map(n => "<b>" + esc(n) + "</b>").join("") : '<span class="livre">a definir</span>') +
      "</span></div>";
  }).join("") + "</div>";
}

function htmlData(t, destaque) {
  const d = dt(t.data), n = dias(hojeISO(), t.data), rel = relativo(n);
  const tag = destaque
    ? (n === 0 ? '<span class="tag tag-h">No ar hoje</span>' : '<span class="tag tag-a">Próxima</span>')
    : (rel ? '<span class="tag">' + esc(rel) + "</span>" : "");
  const acs = editando ? '<div class="acs"><button type="button" class="btn btn-g btn-p" data-a="editar-data" data-id="' + t.id + '" aria-label="Editar">' + ic("lapis") +
    '</button><button type="button" class="btn btn-x btn-p" data-a="apagar-data" data-id="' + t.id + '" aria-label="Apagar">' + ic("lixo") + "</button></div>" : "";
  return '<article class="data-card' + (destaque ? " proxima" : "") + '"><div class="linha1">' +
    '<div class="dia"><b>' + String(d.getDate()).padStart(2, "0") + "</b><span>" + mesCurto(d) + "</span></div>" +
    '<div class="info"><h3>' + esc(t.titulo) + '</h3><div class="meta"><span>' + maiusc(fSemana.format(d)) + "</span>" +
    (t.hora ? "<span>" + ic("relogio") + esc(t.hora) + "</span>" : "") +
    (t.local ? "<span>" + ic("pino") + esc(t.local) + "</span>" : "") + "</div></div>" +
    tag + acs + "</div>" + htmlCanais(t) +
    (t.observacoes ? '<div class="obs">' + md(t.observacoes) + "</div>" : "") + "</article>";
}

function telaGeral() {
  const hoje = hojeISO();
  const ts = [...ESTADO.transmissoes].sort((a, b) => (a.data + a.hora).localeCompare(b.data + b.hora));
  const futuras = ts.filter(t => t.data >= hoje);
  const passadas = ts.filter(t => t.data < hoje).reverse();
  const nova = editando ? '<button type="button" class="btn" data-a="nova-data">' + ic("mais") + " Nova data</button>" : "";

  const corpo = futuras.length
    ? '<div class="col">' + htmlData(futuras[0], true) + futuras.slice(1).map(t => htmlData(t, false)).join("") + "</div>"
    : '<div class="vazio"><strong>Nenhuma data de transmissão cadastrada</strong><p>' +
      (editando ? "Cadastre a próxima data e defina quem fica em cada função." : "Assim que a liderança publicar a próxima escala, ela aparece aqui.") +
      "</p>" + nova + "</div>";

  const hist = passadas.length ? '<section class="secao"><h2>Já transmitido</h2><div class="caixa">' + passadas.map(t => {
    const q = Object.values(t.escala || {}).flat().length;
    return '<div class="linha"><span class="d">' + fCurta.format(dt(t.data)) + '</span><span class="t">' + esc(t.titulo) + '</span><span class="livre">' +
      (q ? q + " escalado(s)" : "sem escala") + "</span>" +
      (editando ? '<div class="acs"><button type="button" class="btn btn-g btn-p" data-a="editar-data" data-id="' + t.id + '" aria-label="Editar">' + ic("lapis") +
        '</button><button type="button" class="btn btn-x btn-p" data-a="apagar-data" data-id="' + t.id + '" aria-label="Apagar">' + ic("lixo") + "</button></div>" : "") + "</div>";
  }).join("") + "</div></section>" : "";

  return '<div class="cab"><div><h1>Próximas transmissões</h1><p class="sub">Quem está escalado em cada função, por data.</p></div>' +
    (futuras.length ? nova : "") + "</div>" + corpo + hist +
    '<section class="secao"><h2>Avisos e informações</h2>' + htmlBlocos("geral", "Nenhum aviso publicado") + "</section>";
}

/* ---------------- equipes ---------------- */
function telaEquipes() {
  if (!ESTADO.equipes.length) {
    return '<div class="cab"><div><h1>Equipes</h1></div></div><div class="vazio"><strong>Nenhuma equipe cadastrada</strong><p>Crie as funções do ministério para montar a escala.</p>' +
      (editando ? '<button type="button" class="btn" data-a="nova-equipe">' + ic("mais") + " Nova equipe</button>" : "") + "</div>";
  }
  const eq = ESTADO.equipes.find(e => e.id === equipeAtual) || ESTADO.equipes[0];
  equipeAtual = eq.id;

  const lateral = '<nav class="lateral" aria-label="Equipes"><span class="tit">Equipes</span>' +
    ESTADO.equipes.map(e => {
      const q = (ESTADO.membros[e.id] || []).length;
      return '<button type="button" data-a="ir-equipe" data-id="' + esc(e.id) + '"' + (e.id === eq.id ? ' aria-current="page"' : "") +
        "><span>" + esc(e.nome) + "</span>" + (q ? '<span class="n">' + q + "</span>" : "") + "</button>";
    }).join("") +
    (editando ? '<button type="button" data-a="nova-equipe" style="color:var(--accent)">+ Nova equipe</button>' : "") + "</nav>";

  const gente = (ESTADO.membros[eq.id] || []).map(m =>
    '<div class="pessoa"><span class="ini" aria-hidden="true">' + esc(m.nome.trim().charAt(0).toUpperCase()) + '</span><div class="dd"><strong>' + esc(m.nome) + "</strong>" +
    (m.contato ? "<small>" + esc(m.contato) + "</small>" : "") + (m.observacao ? "<small>" + esc(m.observacao) + "</small>" : "") + "</div>" +
    (editando ? '<div class="acs"><button type="button" class="btn btn-g btn-p" data-a="editar-membro" data-eq="' + esc(eq.id) + '" data-id="' + m.id + '" aria-label="Editar">' + ic("lapis") +
      '</button><button type="button" class="btn btn-x btn-p" data-a="apagar-membro" data-eq="' + esc(eq.id) + '" data-id="' + m.id + '" aria-label="Remover">' + ic("lixo") + "</button></div>" : "") + "</div>").join("");

  const hoje = hojeISO();
  const prox = ESTADO.transmissoes.filter(t => t.data >= hoje && ((t.escala || {})[eq.id] || []).length)
    .sort((a, b) => a.data.localeCompare(b.data)).slice(0, 6)
    .map(t => '<div class="linha"><span class="d">' + fCurta.format(dt(t.data)) + '</span><span class="t">' + esc(t.titulo) + '</span><span class="op">' +
      ((t.escala || {})[eq.id] || []).map(n => "<b>" + esc(n) + "</b>").join("") + "</span></div>").join("");

  const conteudo = '<div class="eq-cab"><div style="flex:1;min-width:210px"><h1>' + esc(eq.nome) + "</h1>" +
    (eq.resumo ? '<p class="sub">' + esc(eq.resumo) + "</p>" : "") + "</div>" +
    (editando ? '<div class="acs"><button type="button" class="btn btn-2 btn-p" data-a="editar-equipe" data-id="' + esc(eq.id) + '">' + ic("lapis") +
      ' Editar</button><button type="button" class="btn btn-x btn-p" data-a="apagar-equipe" data-id="' + esc(eq.id) + '" aria-label="Apagar equipe">' + ic("lixo") + "</button></div>" : "") + "</div>" +
    '<section class="secao" style="margin-top:24px"><h2>Como funciona</h2>' + htmlBlocos("equipe:" + eq.id, "Sem orientações publicadas") + "</section>" +
    '<section class="secao"><h2>Quem serve nesta equipe</h2>' +
    (gente ? '<div class="gente">' + gente + "</div>" : '<div class="vazio"><strong>Nenhuma pessoa cadastrada</strong><p>Cadastre a equipe para agilizar o preenchimento da escala.</p></div>') +
    (editando ? '<div style="margin-top:12px"><button type="button" class="btn btn-2" data-a="novo-membro" data-eq="' + esc(eq.id) + '">' + ic("mais") + " Adicionar pessoa</button></div>" : "") + "</section>" +
    '<section class="secao"><h2>Próximas escalas desta equipe</h2>' +
    (prox ? '<div class="caixa">' + prox + "</div>" : '<div class="vazio"><strong>Ninguém escalado ainda</strong><p>As datas com escala desta função aparecem aqui.</p></div>') + "</section>";

  return '<div class="eq-layout">' + lateral + "<div>" + conteudo + "</div></div>";
}

function telaInstrucoes() {
  return '<div class="cab"><div><h1>Instruções</h1><p class="sub">Combinados e procedimentos que valem para todas as funções.</p></div></div>' +
    '<div style="max-width:760px">' + htmlBlocos("instrucoes", "Nenhuma instrução publicada") + "</div>";
}

/* ---------------- render ---------------- */
function render() {
  document.querySelectorAll(".abas button").forEach(b => {
    if (b.dataset.aba === aba) b.setAttribute("aria-current", "page");
    else b.removeAttribute("aria-current");
  });
  document.getElementById("faixa").hidden = !editando;
  const be = document.getElementById("btn-editar");
  be.hidden = editando || !artifact;
  app.innerHTML = aba === "equipes" ? telaEquipes() : aba === "instrucoes" ? telaInstrucoes() : telaGeral();
  const at = app.querySelector('.lateral button[aria-current="page"]');
  if (at) { const m = at.parentElement; if (m.scrollWidth > m.clientWidth) m.scrollLeft = at.offsetLeft - (m.clientWidth - at.offsetWidth) / 2; }
}

/* ---------------- publicar ---------------- */
function montarDocumento() {
  const raiz = document.documentElement.cloneNode(true);
  raiz.querySelector("#app").innerHTML = "";
  raiz.querySelector("#modais").innerHTML = "";
  raiz.querySelector("#avisos").innerHTML = "";
  raiz.querySelector("#faixa").hidden = true;
  raiz.querySelector("#btn-editar").hidden = true;
  raiz.querySelector("#estado").textContent = JSON.stringify(ESTADO);
  raiz.removeAttribute("data-theme");
  return "<!doctype html>\n" + raiz.outerHTML;
}

let publicando = false;
async function salvar(mensagem) {
  if (!artifact) { aviso("Edição indisponível nesta visualização.", true); return; }
  if (publicando) return;
  publicando = true;
  try {
    await artifact.publish(montarDocumento());
    aviso(mensagem || "Salvo.");
  } catch (e) {
    const c = e && e.code;
    if (c === "conflict") aviso("Alguém salvou antes de você. A página vai recarregar com a versão mais nova.", true);
    else if (c === "not_granted" || c === "not_writer") aviso("Você está com acesso de leitura neste link — não dá para salvar.", true);
    else aviso("Não foi possível salvar. Tente de novo.", true);
    throw e;
  } finally {
    publicando = false;
  }
}

/* ---------------- modais ---------------- */
function abrirModal(o) {
  const anterior = document.activeElement;
  const fundo = document.createElement("div");
  fundo.className = "fundo";
  fundo.innerHTML = '<form class="modal" role="dialog" aria-modal="true" aria-label="' + esc(o.titulo) + '">' +
    '<div class="modal-cab"><h2>' + esc(o.titulo) + '</h2><button type="button" class="ico" data-fechar aria-label="Fechar">' + ic("x") + "</button></div>" +
    '<div class="modal-corpo"><div class="erro" hidden></div>' + o.corpo + "</div>" +
    '<div class="modal-pe"><button type="button" class="btn btn-2" data-fechar>Cancelar</button>' +
    '<button type="submit" class="btn"' + (o.perigo ? ' style="background:var(--onair);color:#fff"' : "") + ">" + esc(o.salvar || "Salvar") + "</button></div></form>";
  raizModais.appendChild(fundo);

  const form = fundo.querySelector("form"), cxErro = fundo.querySelector(".erro"), ok = form.querySelector('button[type="submit"]');
  const fechar = () => {
    if (!fundo.isConnected) return;
    fundo.remove();
    document.removeEventListener("keydown", tecla);
    if (o.aoFechar) o.aoFechar();
    if (anterior && anterior.focus) anterior.focus();
  };
  const tecla = ev => { if (ev.key === "Escape") fechar(); };
  document.addEventListener("keydown", tecla);
  fundo.addEventListener("click", ev => { if (ev.target === fundo || ev.target.closest("[data-fechar]")) fechar(); });
  form.addEventListener("submit", async ev => {
    ev.preventDefault();
    cxErro.hidden = true;
    ok.disabled = true;
    try { await o.aoConfirmar({ form, fechar }); }
    catch (e) { cxErro.textContent = (e && e.message) || "Não foi possível concluir."; cxErro.hidden = false; }
    finally { ok.disabled = false; }
  });
  const p = form.querySelector("input, textarea");
  if (p) setTimeout(() => p.focus(), 40);
  return { fundo, form, fechar };
}

function confirmar(titulo, texto, rotulo) {
  return new Promise(resolve => {
    let feito = false;
    const responder = v => { if (!feito) { feito = true; resolve(v); } };
    abrirModal({
      titulo, perigo: true, salvar: rotulo || "Apagar",
      corpo: '<p style="color:var(--muted);font-size:14px">' + esc(texto) + "</p>",
      aoConfirmar: ({ fechar }) => { responder(true); fechar(); },
      aoFechar: () => responder(false)
    });
  });
}

/* ---------------- edicao ---------------- */
function modalPin() {
  abrirModal({
    titulo: "Entrar no modo edição", salvar: "Entrar",
    corpo: '<p style="color:var(--muted);font-size:13.5px;margin-bottom:15px">A visualização é livre para todos. O PIN libera a edição da escala e dos textos.</p>' +
      '<div class="campo"><label for="pin">PIN de edição</label><input type="password" id="pin" name="pin" autocomplete="current-password" required></div>',
    aoConfirmar: ({ form, fechar }) => {
      if (form.pin.value !== PIN) throw new Error("PIN incorreto.");
      editando = true;
      fechar();
      render();
      aviso("Modo edição liberado.");
    }
  });
}

function modalData(t) {
  const novo = !t;
  const d = t || { data: "", hora: "19:00", titulo: "", local: "", observacoes: "", escala: {} };
  const campos = ESTADO.equipes.map(eq => {
    const nomes = (d.escala || {})[eq.id] || [];
    const sug = (ESTADO.membros[eq.id] || []).map(m =>
      '<button type="button" class="sug" data-sug="esc-' + esc(eq.id) + '" data-nome="' + esc(m.nome) + '">+ ' + esc(m.nome) + "</button>").join("");
    return '<div class="esc-campo"><label for="esc-' + esc(eq.id) + '">' + esc(eq.nome) + '</label><div>' +
      '<input type="text" id="esc-' + esc(eq.id) + '" data-eq="' + esc(eq.id) + '" value="' + esc(nomes.join(", ")) + '" placeholder="Nomes separados por vírgula">' +
      (sug ? '<div class="sugs">' + sug + "</div>" : "") + "</div></div>";
  }).join("");

  const { fundo } = abrirModal({
    titulo: novo ? "Nova data de transmissão" : "Editar data",
    salvar: novo ? "Cadastrar" : "Salvar alterações",
    corpo: '<div class="duo"><div class="campo"><label for="data">Data</label><input type="date" id="data" name="data" value="' + esc(d.data) + '" required></div>' +
      '<div class="campo"><label for="hora">Horário</label><input type="time" id="hora" name="hora" value="' + esc(d.hora) + '"></div></div>' +
      '<div class="campo"><label for="titulo">Evento</label><input type="text" id="titulo" name="titulo" value="' + esc(d.titulo) + '" placeholder="Culto de domingo" required maxlength="120"></div>' +
      '<div class="campo"><label for="local">Local <span class="dica">(opcional)</span></label><input type="text" id="local" name="local" value="' + esc(d.local) + '" placeholder="Templo sede" maxlength="120"></div>' +
      '<div class="campo" style="margin-top:20px"><label style="font-size:11.5px;text-transform:uppercase;letter-spacing:.09em">Escala</label><div>' + campos + "</div></div>" +
      '<div class="campo"><label for="observacoes">Observações <span class="dica">(opcional)</span></label><textarea id="observacoes" name="observacoes" style="min-height:78px" maxlength="2000" placeholder="Ex.: ensaio da banda às 17h">' + esc(d.observacoes) + "</textarea></div>",
    aoConfirmar: async ({ form, fechar }) => {
      const escala = {};
      form.querySelectorAll("input[data-eq]").forEach(c => {
        const ns = c.value.split(/[,;]/).map(s => s.trim()).filter(Boolean);
        if (ns.length) escala[c.dataset.eq] = ns;
      });
      const reg = {
        id: novo ? uid() : t.id,
        data: form.data.value, hora: form.hora.value, titulo: form.titulo.value.trim(),
        local: form.local.value.trim(), observacoes: form.observacoes.value.trim(), escala
      };
      if (!reg.data || !reg.titulo) throw new Error("Preencha a data e o nome do evento.");
      if (novo) ESTADO.transmissoes.push(reg);
      else ESTADO.transmissoes[ESTADO.transmissoes.findIndex(x => x.id === t.id)] = reg;
      await salvar(novo ? "Data cadastrada." : "Data atualizada.");
      fechar();
      render();
    }
  });

  fundo.addEventListener("click", ev => {
    const b = ev.target.closest("[data-sug]");
    if (!b) return;
    const campo = fundo.querySelector("#" + CSS.escape(b.dataset.sug));
    const ns = campo.value.split(/[,;]/).map(s => s.trim()).filter(Boolean);
    if (!ns.includes(b.dataset.nome)) ns.push(b.dataset.nome);
    campo.value = ns.join(", ");
  });
}

function modalBloco(pag, b) {
  abrirModal({
    titulo: b ? "Editar bloco" : "Novo bloco de conteúdo",
    salvar: b ? "Salvar" : "Publicar",
    corpo: '<div class="campo"><label for="titulo">Título <span class="dica">(opcional)</span></label><input type="text" id="titulo" name="titulo" value="' + esc(b ? b.titulo : "") + '" maxlength="120"></div>' +
      '<div class="campo"><label for="corpo">Conteúdo</label><textarea id="corpo" name="corpo" maxlength="20000" placeholder="Escreva aqui…">' + esc(b ? b.corpo : "") + "</textarea>" +
      '<span class="dica">Formatação: <code>**negrito**</code>, <code>- lista</code>, <code>1. numerada</code>, <code>## subtítulo</code>, <code>&gt; destaque</code>.</span></div>',
    aoConfirmar: async ({ form, fechar }) => {
      const corpo = form.corpo.value.trim();
      if (!corpo) throw new Error("Escreva algum conteúdo.");
      if (!ESTADO.blocos[pag]) ESTADO.blocos[pag] = [];
      if (b) { b.titulo = form.titulo.value.trim(); b.corpo = corpo; }
      else ESTADO.blocos[pag].push({ id: uid(), titulo: form.titulo.value.trim(), corpo });
      await salvar("Conteúdo salvo.");
      fechar();
      render();
    }
  });
}

function modalMembro(eqId, m) {
  abrirModal({
    titulo: m ? "Editar pessoa" : "Adicionar pessoa",
    corpo: '<div class="campo"><label for="nome">Nome</label><input type="text" id="nome" name="nome" value="' + esc(m ? m.nome : "") + '" required maxlength="80"></div>' +
      '<div class="campo"><label for="contato">Contato <span class="dica">(opcional)</span></label><input type="text" id="contato" name="contato" value="' + esc(m ? m.contato : "") + '" placeholder="WhatsApp, e-mail…" maxlength="120"></div>' +
      '<div class="campo"><label for="observacao">Observação <span class="dica">(opcional)</span></label><input type="text" id="observacao" name="observacao" value="' + esc(m ? m.observacao : "") + '" placeholder="Ex.: disponível só aos domingos" maxlength="300"></div>',
    aoConfirmar: async ({ form, fechar }) => {
      const nome = form.nome.value.trim();
      if (!nome) throw new Error("Informe o nome.");
      if (!ESTADO.membros[eqId]) ESTADO.membros[eqId] = [];
      if (m) { m.nome = nome; m.contato = form.contato.value.trim(); m.observacao = form.observacao.value.trim(); }
      else ESTADO.membros[eqId].push({ id: uid(), nome, contato: form.contato.value.trim(), observacao: form.observacao.value.trim() });
      await salvar("Equipe atualizada.");
      fechar();
      render();
    }
  });
}

function modalEquipe(eq) {
  abrirModal({
    titulo: eq ? "Editar equipe" : "Nova equipe",
    corpo: '<div class="campo"><label for="nome">Nome da equipe</label><input type="text" id="nome" name="nome" value="' + esc(eq ? eq.nome : "") + '" required maxlength="60" placeholder="Ex.: Áudio"></div>' +
      '<div class="campo"><label for="resumo">Resumo <span class="dica">(uma linha, aparece abaixo do título)</span></label><input type="text" id="resumo" name="resumo" value="' + esc(eq ? eq.resumo : "") + '" maxlength="300"></div>',
    aoConfirmar: async ({ form, fechar }) => {
      const nome = form.nome.value.trim();
      if (!nome) throw new Error("Informe o nome da equipe.");
      if (eq) { eq.nome = nome; eq.resumo = form.resumo.value.trim(); }
      else {
        const id = (nome.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || "equipe") + "-" + uid().slice(-3);
        ESTADO.equipes.push({ id, nome, resumo: form.resumo.value.trim() });
        equipeAtual = id;
      }
      await salvar(eq ? "Equipe atualizada." : "Equipe criada.");
      fechar();
      render();
    }
  });
}

/* ---------------- acoes ---------------- */
const achaData = id => ESTADO.transmissoes.find(t => t.id === id);
const achaBloco = (p, id) => (ESTADO.blocos[p] || []).find(b => b.id === id);
const achaMembro = (e, id) => (ESTADO.membros[e] || []).find(m => m.id === id);

app.addEventListener("click", async ev => {
  const b = ev.target.closest("[data-a]");
  if (!b) return;
  const { a, id, p, eq, dir } = b.dataset;
  try {
    if (a === "ir-equipe") { equipeAtual = id; render(); return; }
    if (a === "nova-data") return modalData(null);
    if (a === "editar-data") return modalData(achaData(id));
    if (a === "apagar-data") {
      const t = achaData(id);
      if (!await confirmar("Apagar data", 'A data "' + t.titulo + '" e a escala dela serão removidas.')) return;
      ESTADO.transmissoes = ESTADO.transmissoes.filter(x => x.id !== id);
      await salvar("Data removida."); render(); return;
    }
    if (a === "novo-bloco") return modalBloco(p, null);
    if (a === "editar-bloco") return modalBloco(p, achaBloco(p, id));
    if (a === "apagar-bloco") {
      if (!await confirmar("Apagar bloco", "Este conteúdo será removido da página.")) return;
      ESTADO.blocos[p] = (ESTADO.blocos[p] || []).filter(x => x.id !== id);
      await salvar("Bloco removido."); render(); return;
    }
    if (a === "mover") {
      const l = ESTADO.blocos[p], i = l.findIndex(x => x.id === id), j = i + Number(dir);
      if (i < 0 || j < 0 || j >= l.length) return;
      [l[i], l[j]] = [l[j], l[i]];
      await salvar("Ordem atualizada."); render(); return;
    }
    if (a === "nova-equipe") return modalEquipe(null);
    if (a === "editar-equipe") return modalEquipe(ESTADO.equipes.find(e => e.id === id));
    if (a === "apagar-equipe") {
      const e = ESTADO.equipes.find(x => x.id === id);
      if (!await confirmar("Apagar equipe", 'A equipe "' + e.nome + '", seus membros e seus textos serão removidos.')) return;
      ESTADO.equipes = ESTADO.equipes.filter(x => x.id !== id);
      delete ESTADO.membros[id];
      delete ESTADO.blocos["equipe:" + id];
      ESTADO.transmissoes.forEach(t => { if (t.escala) delete t.escala[id]; });
      equipeAtual = (ESTADO.equipes[0] || {}).id || null;
      await salvar("Equipe removida."); render(); return;
    }
    if (a === "novo-membro") return modalMembro(eq, null);
    if (a === "editar-membro") return modalMembro(eq, achaMembro(eq, id));
    if (a === "apagar-membro") {
      if (!await confirmar("Remover pessoa", "Ela sai da lista da equipe. As escalas já salvas continuam.")) return;
      ESTADO.membros[eq] = (ESTADO.membros[eq] || []).filter(x => x.id !== id);
      await salvar("Pessoa removida."); render(); return;
    }
  } catch (e) { /* salvar() já avisou */ }
});

document.querySelectorAll(".abas button").forEach(btn =>
  btn.addEventListener("click", () => { aba = btn.dataset.aba; render(); window.scrollTo({ top: 0 }); }));

document.getElementById("btn-tema").addEventListener("click", () => {
  const atual = document.documentElement.dataset.theme ||
    (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  document.documentElement.dataset.theme = atual === "dark" ? "light" : "dark";
});

document.getElementById("btn-editar").addEventListener("click", modalPin);
document.getElementById("btn-sair").addEventListener("click", () => { editando = false; render(); aviso("Você saiu do modo edição."); });

/* ---------------- inicio ---------------- */
render();
if (window.claude && typeof claude.use === "function") {
  claude.use("artifact").then(a => { artifact = a; render(); }).catch(() => {});
}
</script>
